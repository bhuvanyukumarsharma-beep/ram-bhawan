    <script>
      // Puts on the theme chosen on this phone BEFORE the page is drawn, so the wrong colours never flash.
      // (The list is theme name -> colour of the top bar; the same values are in src/lib/theme.ts and styles.css.)
      (function () {
        var c = { classic:'#0f4c4a', dark:'#1b6360', ocean:'#0b4a85', sand:'#6b4423', violet:'#4f3396' }, t = 'classic';
        try { t = localStorage.getItem('rb_theme') || 'classic'; } catch (e) { /* private mode */ }
        if (!c[t]) t = 'classic';
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', c[t]);
      })();
    </script>
